{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<div class="row justify-content-center mt-5">
  <div class="col-sm-8 col-md-5 col-lg-4">
    <div class="card shadow-sm"><div class="card-body p-4">
      <h4 class="mb-3"><i class="bi bi-calculator"></i> Honorários</h4>
      {% if form.errors %}<div class="alert alert-danger">Usuário ou senha incorretos.</div>{% endif %}
      <form method="post">{% csrf_token %}
        <div class="mb-3"><label class="form-label">Usuário</label><input name="username" class="form-control" autofocus required></div>
        <div class="mb-3"><label class="form-label">Senha</label><input name="password" type="password" class="form-control" required></div>
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn btn-primary w-100">Entrar</button>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
